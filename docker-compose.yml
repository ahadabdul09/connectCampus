version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: connectcampus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: connectcampus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: connectcampus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: ../docker/server.Dockerfile
    container_name: connectcampus-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      SERVER_URL: http://localhost:5000
      CLIENT_URL: http://localhost:80
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/connectcampus?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: production-grade-connectcampus-jwt-secret-key-32chars
      JWT_REFRESH_SECRET: production-grade-connectcampus-refresh-secret-key-32chars
      STORAGE_DRIVER: local
      UPLOAD_DIR: ./uploads
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - server_uploads:/app/uploads

  client:
    build:
      context: ./client
      dockerfile: ../docker/client.Dockerfile
    container_name: connectcampus-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  postgres_data:
  redis_data:
  server_uploads:
